# push / Pull Request のたびに PDF をビルドし，Actions の Artifacts からダウンロードできるようにする．
# あわせて textlint で日本語の校正を行う（校正の指摘があっても PDF のビルドは止まらない）．
name: Build PDF

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: latexmk
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: 00_main.pdf

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: textlint
        run: npm run lint
